<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CloudDrive - store, organise and share your files securely."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CloudDrive</title>
    <script>
      // Runs BEFORE the page is painted, so dark-mode users never see a white flash.
      // Must stay in sync with src/theme/ThemeProvider.jsx (same storage key and logic).
      (function () {
        try {
          var stored = localStorage.getItem('clouddrive-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* storage blocked (private mode): fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
